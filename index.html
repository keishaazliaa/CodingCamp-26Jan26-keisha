<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Latihan - Keisha</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">
                <img src="logo revou.png" alt="Logo RevoU">
            </div>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="profile.html">Our Profile</a></li>
                <li><a href="#">Portfolio</a></li>
                <li><a href="#">Message Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1 id="welcome-text">Hi <span id="user-name">Guest</span>, Welcome To Website</h1>
            <p>Ini adalah website latihan pertama</p>
            <div class="banner-container">
                <img src="banner.jpg" alt="Banner Workspace" class="main-banner">
            </div>
        </section>

        <hr>

        <section class="headquarters">
            <h2>Our Headquarter</h2>
            <div class="hq-container">
                <div class="hq-item">
                    <div class="circle-img"><img src="jakarta.jpg" alt="Jakarta"></div>
                    <p>Jakarta</p>
                </div>
                <div class="hq-item">
                    <div class="circle-img"><img src="bandung.jpg" alt="Bandung"></div>
                    <p>Bandung</p>
                </div>
                <div class="hq-item">
                    <div class="circle-img"><img src="surabaya.jpg" alt="Surabaya"></div>
                    <p>Surabaya</p>
                </div>
            </div>
        </section>

        <hr>

        <section class="message-section">
            <h2>Message Us</h2>
            <div class="flex-container">
                <form id="message-form">
                    <div class="form-group">
                        <label>Nama :</label>
                        <input type="text" id="input-nama" placeholder="Nama" required>
                    </div>
                    <div class="form-group">
                        <label>Tanggal Lahir :</label>
                        <input type="date" id="input-tgl" required>
                    </div>
                    <div class="form-group">
                        <label>Jenis Kelamin :</label>
                        <div class="radio-group">
                            <input type="radio" name="gender" value="Laki-Laki" id="l" checked> <label for="l">Laki-Laki</label>
                            <input type="radio" name="gender" value="Perempuan" id="p"> <label for="p">Perempuan</label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Pesan :</label>
                        <textarea id="input-pesan" placeholder="Pesan" required></textarea>
                    </div>
                    <button type="submit">Submit</button>
                </form>

                <div class="display-box">
                    <p><strong>Current time :</strong> <span id="current-time">-</span></p>
                    <br>
                    <p><strong>Nama :</strong> <span id="res-nama">-</span></p>
                    <p><strong>Tanggal Lahir :</strong> <span id="res-tgl">-</span></p>
                    <p><strong>Jenis Kelamin :</strong> <span id="res-gender">-</span></p>
                    <p><strong>Pesan :</strong> <span id="res-pesan">-</span></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Created By Keisha</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
